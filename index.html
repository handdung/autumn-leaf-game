<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>계명 가을길 — 낙엽 피하기</title><style>
:root{--ink:#392619;--orange:#d97832;--cream:#fff5e7;--leaf:#bb4a25}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff8ed,#f4dfc5);color:var(--ink);font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(100%,900px)}header{text-align:center;margin:0 0 14px}h1{font-size:clamp(25px,5vw,42px);margin:0;color:#784121;letter-spacing:-.04em}header p{margin:7px 0 0;color:#725b47}.gamebox{background:#fffaf2;border:1px solid #e7c9a7;border-radius:24px;padding:12px;box-shadow:0 18px 50px #6b42151c}canvas{width:100%;height:auto;display:block;border-radius:15px;background:#f7dfb9;touch-action:none}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 5px 2px}.score{font-weight:800;font-size:18px}.actions{display:flex;gap:8px}button{border:0;border-radius:999px;padding:11px 17px;background:#784121;color:#fff;font-weight:750;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #4c2915;touch-action:none}button:active{transform:translateY(2px);box-shadow:0 1px 0 #4c2915}.help{text-align:center;font-size:14px;color:#755b45;padding:8px 5px 2px}.touch{display:none;justify-content:center;gap:12px;margin-top:12px}.touch button{min-width:112px;background:#b7552d}.foot{text-align:center;font-size:12px;color:#8a705b;margin:12px 0 0}@media(max-width:600px){.touch{display:flex}.bar{align-items:flex-start}.score{font-size:16px}button{padding:10px 14px}}
</style></head><body><main class="wrap"><header><h1>🍂 계명 가을길</h1><p>계명대학교 캠퍼스를 달리며 가을 낙엽을 피해 보세요!</p></header><section class="gamebox"><canvas id="game" width="900" height="440" aria-label="낙엽 피하기 게임"></canvas><div class="bar"><div class="score">점수 <span id="score">0</span>　최고 <span id="best">0</span></div><div class="actions"><button id="start">게임 시작</button><button id="reset">다시 하기</button></div></div><div class="help">키보드: ↑ 또는 Space 점프 · ↓ 키를 누르는 동안 슬라이드　|　휴대폰: 아래 버튼을 누르고 있는 동안 슬라이드</div></section><div class="touch"><button id="jump">점프</button><button id="slide">누르고 슬라이드</button></div><p class="foot">가볍게 즐기는 계명대학교 가을 풍경 게임 · 개인 기록은 이 브라우저에 저장됩니다</p></main><script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let running=false,over=false,score=0,best=+(localStorage.autumnBest||0),frame=0,leaves=[],clouds=[],slideHeld=false;bestEl.textContent=best;const ground=344,player={x:132,y:ground,w:40,h:78,vy:0,jumping:false,sliding:0};function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function drawBg(){let g=ctx.createLinearGradient(0,0,0,440);g.addColorStop(0,'#f7dfb9');g.addColorStop(.62,'#f4d3a6');g.addColorStop(1,'#dca36e');ctx.fillStyle=g;ctx.fillRect(0,0,900,440);ctx.fillStyle='#ba936e';ctx.globalAlpha=.28;ctx.fillRect(0,220,900,85);ctx.fillStyle='#a57c5c';ctx.fillRect(80,170,210,95);ctx.fillRect(112,145,145,25);ctx.fillRect(350,190,160,75);for(let i=0;i<9;i++)ctx.fillRect(95+i*21,190,8,60);ctx.fillRect(620,176,190,90);ctx.globalAlpha=1;for(const x of [45,315,560,840]){ctx.fillStyle='#704a33';ctx.fillRect(x,174,12,130);for(let j=0;j<4;j++){ctx.fillStyle=['#bb5a2f','#d48a36','#a74729'][j%3];ctx.beginPath();ctx.arc(x+6+(j%2?18:-16),160+j*19,25-j*2,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#cf7136';ctx.fillRect(0,ground,900,96);ctx.fillStyle='#e59a5b';ctx.fillRect(0,ground,900,8);ctx.strokeStyle='#f2b77c';ctx.lineWidth=2;for(let x=(frame*2)%90-90;x<900;x+=90){ctx.beginPath();ctx.moveTo(x,ground);ctx.lineTo(x,440);ctx.stroke()}for(let y=ground+46;y<440;y+=46){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}ctx.fillStyle='#8f5737';ctx.fillRect(0,ground+92,900,8)}function drawPerson(){let h=player.sliding>0?34:player.h,y=player.y;if(player.sliding>0)y=ground-34;ctx.save();ctx.fillStyle='#555b60';ctx.strokeStyle='#555b60';ctx.lineWidth=12;ctx.lineCap='round';if(player.sliding>0){ctx.beginPath();ctx.arc(player.x+13,y+10,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(player.x+27,y+15);ctx.lineTo(player.x+53,y+18);ctx.moveTo(player.x+34,y+18);ctx.lineTo(player.x+20,y+31);ctx.moveTo(player.x+43,y+18);ctx.lineTo(player.x+55,y+30);ctx.stroke()}else{ctx.beginPath();ctx.arc(player.x+20,y+13,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(player.x+20,y+27);ctx.lineTo(player.x+20,y+54);ctx.moveTo(player.x+20,y+35);ctx.lineTo(player.x+3,y+48);ctx.moveTo(player.x+20,y+35);ctx.lineTo(player.x+38,y+44);ctx.moveTo(player.x+20,y+54);ctx.lineTo(player.x+7,y+75);ctx.moveTo(player.x+20,y+54);ctx.lineTo(player.x+35,y+75);ctx.stroke()}ctx.restore();return{x:player.x+3,y,w:52,h}}function leafShape(l){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.rot);ctx.fillStyle=l.color;ctx.beginPath();ctx.moveTo(-l.s,0);ctx.quadraticCurveTo(-l.s*.45,-l.s*.8,0,-l.s*.48);ctx.quadraticCurveTo(l.s*.48,-l.s*.8,l.s,0);ctx.quadraticCurveTo(l.s*.48,l.s*.8,0,l.s*.48);ctx.quadraticCurveTo(-l.s*.45,l.s*.8,-l.s,0);ctx.fill();ctx.strokeStyle='#823b20';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-l.s,0);ctx.lineTo(l.s,0);ctx.stroke();ctx.restore()}function overlay(title,sub){ctx.fillStyle='#3b291f99';ctx.fillRect(0,0,900,440);rounded(205,135,490,160,22,'#fff8ed');ctx.fillStyle='#74401f';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(title,450,195);ctx.font='18px system-ui';ctx.fillStyle='#755b45';ctx.fillText(sub,450,238);ctx.font='15px system-ui';ctx.fillText('시작 버튼을 눌러 다시 도전하세요',450,270)}function spawn(){const size=18+Math.random()*10;leaves.push({x:930,y:ground-23-Math.random()*72,s:size,rot:Math.random()*6,vy:.4+Math.random()*.6,vx:2.3+Math.random()*.8,color:['#c6532c','#e29332','#a94426','#d36c32'][Math.floor(Math.random()*4)],kind:Math.random()<.45?'low':'high'})}function loop(){drawBg();if(running){frame++;score+=.13;scoreEl.textContent=Math.floor(score);if(frame%94===0)spawn();for(const l of leaves){l.x-=l.vx;l.y+=Math.sin((frame+l.x)*.035)*.35;l.rot+=.035;leafShape(l)}leaves=leaves.filter(l=>l.x>-50);if(player.jumping){player.y+=player.vy;player.vy+=.48;if(player.y>=ground-player.h){player.y=ground-player.h;player.jumping=false;player.vy=0}}player.sliding=slideHeld&&!player.jumping?1:0;const p=drawPerson();for(const l of leaves){let lx=l.x-l.s*.65,ly=l.y-l.s*.45,lw=l.s*1.3,lh=l.s*.9;const insetX=p.w*.24,insetY=p.h*.12,px=p.x+insetX,py=p.y+insetY,pw=p.w-insetX*2,ph=p.h-insetY*2,leafPad=l.s*.35;lx+=leafPad;ly+=leafPad;lw-=leafPad*2;lh-=leafPad*2;const hits=!(px+pw<lx||px>lx+lw||py+ph<ly||py>ly+lh);if(hits){running=false;over=true;slideHeld=false;best=Math.max(best,Math.floor(score));localStorage.autumnBest=best;bestEl.textContent=best;break}}}else{for(const l of leaves)leafShape(l);drawPerson();if(over)overlay('아깝다! 🍂','점수 '+Math.floor(score)+'점 · 낙엽을 점프하거나 슬라이드로 피해 보세요');else overlay('가을 낙엽을 피해봐요!','점프와 슬라이드로 누구나 쉽게 즐길 수 있어요')}requestAnimationFrame(loop)}function start(){score=0;frame=0;leaves=[];player.y=ground-player.h;player.vy=0;player.jumping=false;player.sliding=0;slideHeld=false;over=false;running=true;scoreEl.textContent='0'}function jump(){if(!running)return;if(!player.jumping){player.jumping=true;player.vy=-10.7;slideHeld=false;player.sliding=0}}function beginSlide(e){e.preventDefault();if(running&&!player.jumping)slideHeld=true}function endSlide(){slideHeld=false}document.querySelector('#start').onclick=start;document.querySelector('#reset').onclick=start;document.querySelector('#jump').onpointerdown=e=>{e.preventDefault();jump()};const slideButton=document.querySelector('#slide');slideButton.addEventListener('pointerdown',beginSlide);['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(type=>slideButton.addEventListener(type,endSlide));window.addEventListener('pointerup',endSlide);window.addEventListener('blur',endSlide);window.addEventListener('keydown',e=>{if(['ArrowUp',' ','ArrowDown'].includes(e.key))e.preventDefault();if(e.key==='ArrowUp'||e.key===' ')jump();if(e.key==='ArrowDown'&&running&&!player.jumping)slideHeld=true;if(!running&&e.key==='Enter')start()});window.addEventListener('keyup',e=>{if(e.key==='ArrowDown')endSlide()});c.addEventListener('pointerdown',e=>{if(!running){start();return}const r=c.getBoundingClientRect();if(e.clientY-r.top<r.height*.65)jump();else if(!player.jumping)slideHeld=true});c.addEventListener('pointerup',endSlide);c.addEventListener('pointercancel',endSlide);loop()})();
</script></body></html>
